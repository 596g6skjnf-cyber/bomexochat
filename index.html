<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoMexoChat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .app {
      max-width: 600px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .header {
      padding: 18px;
      background: #111;
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #eeeeee;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      max-width: 80%;
    }

    .message.me {
      margin-left: auto;
      background: #d9fdd3;
    }

    .name {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .text {
      font-size: 16px;
      word-wrap: break-word;
    }

    .bottom {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 0 20px;
      border-radius: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    BoMexoChat
  </div>

  <div id="messages">
    Загрузка сообщений...
  </div>

  <div class="bottom">
    <input
      id="messageInput"
      type="text"
      placeholder="Написать сообщение..."
    >

    <button onclick="sendMessage()">
      Отправить
    </button>
  </div>

</div>

<script>

  // ==========================================
  // НАСТРОЙКИ SUPABASE
  // ==========================================

  const SUPABASE_URL = "ВСТАВЬ_СЮДА_URL_SUPABASE";

  const SUPABASE_ANON_KEY = "ВСТАВЬ_СЮДА_ANON_KEY";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ==========================================
  // ПОЛУЧАЕМ UID ТЕКУЩЕГО ПОЛЬЗОВАТЕЛЯ
  // ==========================================

  let currentUser = null;


  async function getUser() {

    const { data, error } =
      await supabaseClient.auth.getUser();

    if (error) {
      console.log(error);
      return;
    }

    currentUser = data.user;

    console.log("UID пользователя:", currentUser.id);

  }


  // ==========================================
  // ЗАГРУЗКА СООБЩЕНИЙ
  // ==========================================

  async function loadMessages() {

    const { data, error } = await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: true
      });

    if (error) {

      console.log(error);

      document.getElementById("messages").innerHTML =
        "Ошибка загрузки сообщений";

      return;
    }

    displayMessages(data);
  }


  // ==========================================
  // ПОКАЗЫВАЕМ СООБЩЕНИЯ
  // ==========================================

  function displayMessages(messages) {

    const container =
      document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(message => {

      const div =
        document.createElement("div");

      div.className = "message";

      if (
        currentUser &&
        message.sender_id === currentUser.id
      ) {

        div.classList.add("me");

      }

      div.innerHTML = `
        <div class="name">
          ${message.sender_id}
        </div>

        <div class="text">
          ${escapeHtml(message.text)}
        </div>
      `;

      container.appendChild(div);

    });

    container.scrollTop =
      container.scrollHeight;
  }


  // ==========================================
  // ОТПРАВКА СООБЩЕНИЯ
  // ==========================================

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const text =
      input.value.trim();

    if (!text) {
      return;
    }

    if (!currentUser) {

      alert("Пользователь не авторизован");

      return;
    }


    const { error } =
      await supabaseClient
        .from("messages")
        .insert({

          sender_id: currentUser.id,

          text: text

        });


    if (error) {

      console.log(error);

      alert(
        "Ошибка отправки: " +
        error.message
      );

      return;
    }


    input.value = "";

    loadMessages();
  }


  // ==========================================
  // ЗАЩИТА ОТ HTML
  // ==========================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  // ==========================================
  // REALTIME
  // ==========================================

  supabaseClient
    .channel("messages-channel")

    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },

      payload => {

        loadMessages();

      }
    )

    .subscribe();


  // ==========================================
  // ЗАПУСК
  // ==========================================

  async function start() {

    await getUser();

    await loadMessages();

  }

  start();


  // ENTER = ОТПРАВИТЬ
  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );

</script>

</body>
</html>
