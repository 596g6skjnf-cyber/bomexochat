<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>BoMexochat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111111;
      color: white;
    }

    button, input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #181818;
      border-bottom: 1px solid #292929;
      font-size: 22px;
      font-weight: 700;
    }

    .screen {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 1px solid #333;
      border-radius: 12px;
      background: #202020;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #3ecf8e;
      color: #07130d;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary {
      background: #292929;
      color: white;
    }

    .error {
      color: #ff7070;
      margin-top: 12px;
    }

    .success {
      color: #3ecf8e;
      margin-top: 12px;
    }

    .hidden {
      display: none !important;
    }

    .chat {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 80%;
      margin-bottom: 10px;
      padding: 11px 14px;
      border-radius: 16px;
      background: #252525;
      word-wrap: break-word;
    }

    .message.mine {
      margin-left: auto;
      background: #3ecf8e;
      color: #07130d;
    }

    .message small {
      display: block;
      opacity: .65;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .send {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #181818;
      border-top: 1px solid #292929;
    }

    .send input {
      margin: 0;
    }

    .send button {
      width: 90px;
      margin: 0;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #181818;
      border-bottom: 1px solid #292929;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 9px 14px;
      background: #292929;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- AUTH -->
  <div id="authScreen" class="screen">

    <h1>BoMexochat</h1>
    <p>Вход в чат</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">

    <button onclick="login()">Войти</button>
    <button class="secondary" onclick="register()">Создать аккаунт</button>

    <div id="authMessage"></div>

  </div>

  <!-- CHAT -->
  <div id="chatScreen" class="hidden">

    <div class="topline">
      <strong>BoMexochat</strong>
      <button class="logout" onclick="logout()">Выйти</button>
    </div>

    <div class="chat">

      <div id="messages" class="messages">
      </div>

      <div class="send">
        <input id="messageInput"
               type="text"
               placeholder="Введите сообщение..."
               onkeydown="if(event.key==='Enter') sendMessage()">

        <button onclick="sendMessage()">➤</button>
      </div>

    </div>

  </div>

</div>


<script>

  /*
   * SUPABASE
   */

  const SUPABASE_URL =
    "https://obvmaawwqpttcawiimho.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_3RhP9u3h3MUXjd2E5vrYCg_jp1G3tKJ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;
  let currentChatId = null;


  /*
   * START
   */

  async function start() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

      currentUser = session.user;

      await openChat();

    } else {

      showAuth();

    }
  }


  /*
   * AUTH SCREEN
   */

  function showAuth() {

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

    document
      .getElementById("chatScreen")
      .classList.add("hidden");
  }


  /*
   * LOGIN
   */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showAuthMessage(
        "Введите email и пароль",
        false
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showAuthMessage(
        error.message,
        false
      );

      return;
    }

    currentUser = data.user;

    await openChat();
  }


  /*
   * REGISTER
   */

  async function register() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showAuthMessage(
        "Введите email и пароль",
        false
      );

      return;
    }

    if (password.length < 6) {

      showAuthMessage(
        "Пароль должен быть минимум 6 символов",
        false
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {

      showAuthMessage(
        error.message,
        false
      );

      return;
    }

    if (data.user) {

      currentUser = data.user;

      await createProfile();

      showAuthMessage(
        "Аккаунт создан",
        true
      );

      await openChat();
    }
  }


  /*
   * PROFILE
   */

  async function createProfile() {

    if (!currentUser) return;

    const username =
      currentUser.email
        ? currentUser.email.split("@")[0]
        : "user";

    await supabaseClient
      .from("profiles")
      .upsert({
        id: currentUser.id,
        username: username,
        display_name: username
      });
  }


  /*
   * OPEN CHAT
   */

  async function openChat() {

    document
      .getElementById("authScreen")
      .classList.add("hidden");

    document
      .getElementById("chatScreen")
      .classList.remove("hidden");

    await findOrCreateChat();

    await loadMessages();

    subscribeToMessages();
  }


  /*
   * FIND / CREATE CHAT
   */

  async function findOrCreateChat() {

    const { data: chats, error } =
      await supabaseClient
        .from("chats")
        .select("*")
        .eq("is_group", true)
        .limit(1);

    if (error) {

      console.error(error);

      return;
    }

    if (chats && chats.length > 0) {

      currentChatId = chats[0].id;

    } else {

      const { data, error } =
        await supabaseClient
          .from("chats")
          .insert({
            name: "BoMexochat",
            is_group: true
          })
          .select()
          .single();

      if (error) {

        console.error(error);

        return;
      }

      currentChatId = data.id;
    }

    /*
     * Добавляем пользователя в чат
     */

    if (currentUser && currentChatId) {

      await supabaseClient
        .from("chat_members")
        .upsert({
          chat_id: currentChatId,
          user_id: currentUser.id
        });
    }
  }


  /*
   * LOAD MESSAGES
   */

  async function loadMessages() {

    if (!currentChatId) return;

    const { data, error } =
      await supabaseClient
        .from("messages")
        .select("*")
        .eq("chat_id", currentChatId)
        .order("created_at", {
          ascending: true
        });

    if (error) {

      console.error(error);

      return;
    }

    renderMessages(data || []);
  }


  /*
   * RENDER
   */

  function renderMessages(messages) {

    const container =
      document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(message => {

      const div =
        document.createElement("div");

      div.className = "message";

      if (
        currentUser &&
        message.sender_id === currentUser.id
      ) {

        div.classList.add("mine");
      }

      const small =
        document.createElement("small");

      small.textContent =
        message.sender_id === currentUser?.id
          ? "Вы"
          : "Участник";

      const text =
        document.createElement("div");

      text.textContent =
        message.content || "";

      div.appendChild(small);
      div.appendChild(text);

      container.appendChild(div);
    });

    container.scrollTop =
      container.scrollHeight;
  }


  /*
   * SEND MESSAGE
   */

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const content =
      input.value.trim();

    if (!content) return;

    if (!currentUser || !currentChatId) {

      alert("Нет подключения к чату");

      return;
    }

    const { error } =
      await supabaseClient
        .from("messages")
        .insert({
          chat_id: currentChatId,
          sender_id: currentUser.id,
          content: content,
          message_type: "text"
        });

    if (error) {

      console.error(error);

      alert(
        "Ошибка отправки: " +
        error.message
      );

      return;
    }

    input.value = "";

    await loadMessages();
  }


  /*
   * REALTIME
   */

  function subscribeToMessages() {

    if (!currentChatId) return;

    supabaseClient
      .channel("messages-channel")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "chat_id=eq." + currentChatId
        },
        payload => {

          loadMessages();

        }
      )
      .subscribe();
  }


  /*
   * LOGOUT
   */

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentChatId = null;

    showAuth();
  }


  /*
   * MESSAGE
   */

  function showAuthMessage(text, success) {

    const element =
      document.getElementById("authMessage");

    element.textContent = text;

    element.className =
      success
        ? "success"
        : "error";
  }


  /*
   * RUN
   */

  start();

</script>

</body>
</html>
